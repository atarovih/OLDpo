<html lang="ru">
<head><!DOCTYPE html>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Каталог объявлений</title>
    <!-- Официальный скрипт Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Использование системных цветов Telegram */
        :root {
            --bg-color: var(--tg-theme-bg-color, #f4f4f9);
            --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #222222);
            --hint-color: var(--tg-theme-hint-color, #888888);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
        }

        .header p {
            font-size: 13px;
            color: var(--hint-color);
            margin-top: 4px;
        }

        .catalog {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding-bottom: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: transform 0.1s ease;
        }

        .card:active {
            transform: scale(0.98);
        }

        .card-img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 10px;
            background-color: #e0e0e0;
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            margin: 10px 0 4px 0;
        }

        .card-price {
            font-size: 15px;
            font-weight: 700;
            color: var(--button-color);
            margin-bottom: 10px;
        }

        .btn {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }

        .btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Каталог товаров</h1>
        <p>Выберите нужную позицию</p>
    </div>

    <div class="catalog">
        <!-- Карточка 1 -->
        <div class="card">
            <img src="https://via.placeholder.com/200" alt="Товар 1" class="card-img">
            <div class="card-title">Товар 1</div>
            <div class="card-price">500 ₽</div>
            <button class="btn" onclick="selectItem('Товар 1', 500)">Выбрать</button>
        </div>

        <!-- Карточка 2 -->
        <div class="card">
            <img src="https://via.placeholder.com/200" alt="Товар 2" class="card-img">
            <div class="card-title">Товар 2</div>
            <div class="card-price">1 200 ₽</div>
            <button class="btn" onclick="selectItem('Товар 2', 1200)">Выбрать</button>
        </div>

        <!-- Карточка 3 -->
        <div class="card">
            <img src="https://via.placeholder.com/200" alt="Товар 3" class="card-img">
            <div class="card-title">Товар 3</div>
            <div class="card-price">2 500 ₽</div>
            <button class="btn" onclick="selectItem('Товар 3', 2500)">Выбрать</button>
        </div>

        <!-- Карточка 4 -->
        <div class="card">
            <img src="https://via.placeholder.com/200" alt="Товар 4" class="card-img">
            <div class="card-title">Товар 4</div>
            <div class="card-price">3 900 ₽</div>
            <button class="btn" onclick="selectItem('Товар 4', 3900)">Выбрать</button>
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp API
        const tg = window.Telegram.WebApp;

        // Автоматическое раскрытие приложения на полный экран
        tg.expand();

        // Сообщаем Telegram, что приложение готово
        tg.ready();

        // Функция обработки нажатия кнопки
        function selectItem(title, price) {
            // Виброотклик смартфона при нажатии (Haptic Feedback)
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }

            // Вызов всплывающего уведомления от самого Telegram
            tg.showAlert(`Вы выбрали: ${title}\nСтоимость: ${price} ₽`);
        }
    </script>
</body>
</html>
